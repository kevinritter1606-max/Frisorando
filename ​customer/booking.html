<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Termin buchen</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #ff385c; }
        .step { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .btn { background: #ff385c; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Termin buchen & Checkout</h2>
        <div class="step">
            <p><strong>1. Gewählte Leistung:</strong> Haarschnitt & Styling</p>
            <p><strong>2. Datum & Uhrzeit:</strong> Morgen, 14:00 Uhr</p>
        </div>
        <div class="step">
            <p><strong>Zahlungsart:</strong> PayPal / Apple Pay / Karte</p>
            <p><em>Inkl. digitaler Bon & Trinkgeld-Option</em></p>
        </div>
        <button class="btn">Zahlung bestätigen & Termin sichern</button>
    </div>
</body>
</html>
