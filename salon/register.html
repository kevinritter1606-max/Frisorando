<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Als Partner registrieren</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background: #1a202c; color: #f7fafc; padding: 20px; }
        .reg-container { max-width: 600px; margin: 0 auto; background: #2d3748; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #cbd5e0; }
        .form-input, .form-select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a5568; background: #1a202c; color: white; font-size: 15px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; color: #cbd5e0; }
    </style>
</head>
<body>

    <div class="reg-container">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="margin: 0; color: #63b3ed; font-size: 24px;">Werde Frisorando-Partner</h2>
            <p style="margin: 5px 0 0 0; color: #a0aec0; font-size: 13px;">Gewinne neue Kunden im Salon oder starte mit mobilen Hausbesuchen durch.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Registrierung erfolgreich! Dein Gewerbeschein wird nun vom Admin geprüft. Du erhältst in Kürze eine Freigabe.');">
            
            <div class="form-group">
                <label>Name des Salons oder Stylisten</label>
                <input type="text" class="form-input" placeholder="z. B. HairDesign Max oder Mobile Haarfee Sarah" required>
            </div>

            <div class="form-group">
                <label>Dein Haupt-Standort / Einsatzgebiet (PLZ & Ort)</label>
                <input type="text" class="form-input" placeholder="z. B. 79618 Rheinfelden (Baden)" required>
            </div>

            <div class="form-group">
                <label>Wie möchtest du arbeiten? (Lieferando-Prinzip)</label>
                <select class="form-select">
                    <option>Klassisch im Salon</option>
                    <option>Rein Mobiler Hausbesuch (Umkreis)</option>
                    <option>Beides (Salon & Mobile Hausbesuche)</option>
                </select>
            </div>

            <div class="form-group">
                <label>E-Mail-Adresse für Buchungen & Belege</label>
                <input type="email" class="form-input" placeholder="kontakt@dein-salon.de" required>
            </div>

            <div class="form-group">
                <label>Gewerbeschein oder Handwerkskarten-Nachweis hochladen</label>
                <input type="file" class="form-input" style="padding: 8px; background: #242b38;" required>
                <span style="font-size: 11px; color: #a0aec0; margin-top: 4px; display: block;">Wichtig zur Qualitätssicherung und Freigabe im Admin-Cockpit.</span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" required style="width: 18px; height: 18px;">
                <span>Ich akzeptiere die Partner-AGB und die GoBD-konforme Provisionsvereinbarung.</span>
            </div>

            <button type="submit" class="fr-btn" style="background: #3182ce; margin-top: 25px;">Jetzt Partner-Konto beantragen</button>
        </form>
    </div>

</body>
</html>
