<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Partner-Registrierung & Verifizierung</title>
    <style>
        :root {
            --primary: #ff385c;
            --primary-dark: #e00b3d;
            --success: #137333;
            --success-bg: #e6f4ea;
            --bg-main: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .reg-container {
            max-width: 550px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.15);
        }

        .section-title {
            font-size: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            margin: 25px 0 15px 0;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .fr-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            display: inline-block;
            text-decoration: none;
            margin-top: 25px;
        }

        .fr-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="reg-container">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="margin: 0; color: var(--text-main); font-size: 24px;">Frisorando Partner-Portal</h2>
            <p style="margin: 6px 0 0 0; color: var(--text-muted); font-size: 14px;">Registrierung & rechtssichere Verifizierung.</p>
        </div>

        <form id="reg-form">
            
            <!-- Inhaber -->
            <div class="section-title">1. Inhaber / Ansprechpartner</div>
            <div class="form-group">
                <label>Vorname</label>
                <input type="text" id="owner-firstname" class="form-input" placeholder="z. B. Michael" required>
            </div>
            <div class="form-group">
                <label>Nachname</label>
                <input type="text" id="owner-lastname" class="form-input" placeholder="z. B. Müller" required>
            </div>
            <div class="form-group">
                <label>E-Mail-Adresse</label>
                <input type="email" id="salon-email" class="form-input" placeholder="kontakt@salon-mueller.de" required>
            </div>
            <div class="form-group">
                <label>Telefonnummer</label>
                <input type="tel" id="salon-phone" class="form-input" placeholder="+49 7623 ..." required>
            </div>

            <!-- Betrieb -->
            <div class="section-title">2. Betriebs- & Standortdetails</div>
            <div class="form-group">
                <label>Name des Betriebs / Salon</label>
                <input type="text" id="salon-name" class="form-input" placeholder="z. B. HairDesign Müller" required>
            </div>
            <div class="form-group">
                <label>Betriebs-Art</label>
                <select id="salon-type" class="form-select">
                    <option value="salon">Klassischer Salon vor Ort</option>
                    <option value="mobile">Rein Mobiler Hausbesuch</option>
                    <option value="both">Beides (Salon & Mobile Besuche)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Standort / Einsatzgebiet (PLZ & Ort)</label>
                <input type="text" id="salon-location" class="form-input" placeholder="z. B. 79618 Rheinfelden" required>
            </div>

            <!-- Verifizierung & Meisterbrief -->
            <div class="section-title">3. Handwerksrecht & Verifizierung</div>
            <div class="form-group">
                <label>Meisternummer / Handwerksrollennummer</label>
                <input type="text" id="master-number" class="form-input" placeholder="z. B. HWK-1234567" required>
            </div>
            <div class="form-group">
                <label>Gewerbeschein hochladen</label>
                <input type="file" id="salon-license" class="form-input" style="padding: 10px; background: #f8fafc;" required>
            </div>
            <div class="form-group">
                <label>Meisterbrief / Nachweis Handwerkskammer</label>
                <input type="file" id="master-certificate" class="form-input" style="padding: 10px; background: #f8fafc;" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" required style="width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0;">
                <span>Ich bestätige das Vorliegen der handwerksrechtlichen Voraussetzungen, akzeptiere die AGB und die GoBD-Abwicklung.</span>
            </div>

            <button type="submit" id="submit-btn" class="fr-btn">Verifizierten Partner-Antrag absenden</button>
        </form>
    </div>

    <!-- Firebase Anbindung -->
    <script type="module">
        import { db } from "../assets/js/firebase.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const form = document.getElementById('reg-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Daten werden übermittelt...";
            btn.disabled = true;

            try {
                const newPartner = {
                    ownerFirstname: document.getElementById('owner-firstname').value,
                    ownerLastname: document.getElementById('owner-lastname').value,
                    email: document.getElementById('salon-email').value,
                    phone: document.getElementById('salon-phone').value,
                    name: document.getElementById('salon-name').value,
                    type: document.getElementById('salon-type').value,
                    location: document.getElementById('salon-location').value,
                    masterNumber: document.getElementById('master-number').value,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };

                await addDoc(collection(db, "partners"), newPartner);
                alert('Antrag erfolgreich eingereicht! Gewerbeschein und Meisterbrief werden vom Administrator geprüft.');
                form.reset();
                btn.innerText = "Verifizierten Partner-Antrag absenden";
                btn.disabled = false;
            } catch (error) {
                console.error("Fehler:", error);
                alert('Fehler beim Speichern der Daten.');
                btn.innerText = "Verifizierten Partner-Antrag absenden";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
