<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Professionelle Partner-Registrierung</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background: #1a202c; color: #f7fafc; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .reg-container { max-width: 650px; margin: 0 auto; background: #2d3748; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #cbd5e0; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #4a5568; background: #1a202c; color: white; font-size: 15px; box-sizing: border-box; }
        .form-input:focus, .form-select:focus { border-color: #3182ce; outline: none; box-shadow: 0 0 0 3px rgba(49,130,206,0.2); }
        .section-title { font-size: 16px; color: #63b3ed; border-bottom: 1px solid #4a5568; padding-bottom: 8px; margin: 25px 0 15px 0; font-weight: bold; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 12px; margin-top: 15px; font-size: 14px; color: #cbd5e0; }
    </style>
</head>
<body>

    <div class="reg-container">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="margin: 0; color: #63b3ed; font-size: 26px;">Frisorando Partner-Portal</h2>
            <p style="margin: 8px 0 0 0; color: #a0aec0; font-size: 14px;">Registriere deinen Salon oder deinen mobilen Service für das digitale Zeitalter.</p>
        </div>

        <form id="reg-form">
            
            <!-- Sektion 1: Inhaber -->
            <div class="section-title">1. Angaben zum Inhaber / Ansprechpartner</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Vorname</label>
                    <input type="text" id="owner-firstname" class="form-input" placeholder="z. B. Michael" required>
                </div>
                <div class="form-group">
                    <label>Nachname</label>
                    <input type="text" id="owner-lastname" class="form-input" placeholder="z. B. Müller" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>E-Mail-Adresse (für Buchungen)</label>
                    <input type="email" id="salon-email" class="form-input" placeholder="kontakt@salon-mueller.de" required>
                </div>
                <div class="form-group">
                    <label>Telefonnummer (für Rückfragen)</label>
                    <input type="tel" id="salon-phone" class="form-input" placeholder="+49 7623 ..." required>
                </div>
            </div>

            <!-- Sektion 2: Betrieb -->
            <div class="section-title">2. Betriebs- & Standortdetails</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Name des Betriebs / Salon
