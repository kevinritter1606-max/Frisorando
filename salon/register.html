<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Partner-Registrierung</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background: #1a202c; color: #f7fafc; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
        .reg-container { max-width: 500px; margin: 0 auto; background: #2d3748; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #cbd5e0; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a5568; background: #1a202c; color: white; font-size: 15px; box-sizing: border-box; }
        .form-input:focus, .form-select:focus { border-color: #3182ce; outline: none; box-shadow: 0 0 0 3px rgba(49,130,206,0.2); }
        .section-title { font-size: 15px; color: #63b3ed; border-bottom: 1px solid #4a5568; padding-bottom: 6px; margin: 22px 0 12px 0; font-weight: bold; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; font-size: 13px; color: #cbd5e0; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="reg-container">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="margin: 0; color: #63b3ed; font-size: 22px;">Frisorando Partner-Portal</h2>
            <p style="margin: 6px 0 0 0; color: #a0aec0; font-size: 13px;">Registriere deinen Salon oder mobilen Service.</p>
        </div>

        <form id="reg-form">
            
            <!-- Inhaber -->
            <div class="section-title">1. Inhaber / Ansprechpartner</div>
            <div class="form-group">
                <label>Vorname</label>
                <input type="text" id="owner-firstname" class="form-input" placeholder="z. B. Michael" required>
            </div>
            <div class="form-group">
                <label>Nachname</label>
                <input type="text" id="owner-lastname" class="form-input" placeholder="z. B. Müller" required>
            </div>
            <div class="form-group">
                <label>E-Mail-Adresse</label>
                <input type="email" id="salon-email" class="form-input" placeholder="kontakt@salon-mueller.de" required>
            </div>
            <div class="form-group">
                <label>Telefonnummer</label>
                <input type="tel" id="salon-phone" class="form-input" placeholder="+49 7623 ..." required>
            </div>

            <!-- Betrieb -->
            <div class="section-title">2. Betriebs- & Standortdetails</div>
            <div class="form-group">
                <label>Name des Betriebs / Salon</label>
                <input type="text" id="salon-name" class="form-input" placeholder="z. B. HairDesign Müller" required>
            </div>
            <div class="form-group">
                <label>Betriebs-Art</label>
                <select id="salon-type" class="form-select">
                    <option value="salon">Klassischer Salon vor Ort</option>
                    <option value="mobile">Rein Mobiler Hausbesuch</option>
                    <option value="both">Beides (Salon & Mobile Besuche)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Standort / Einsatzgebiet (PLZ & Ort)</label>
                <input type="text" id="salon-location" class="form-input" placeholder="z. B. 79618 Rheinfelden" required>
            </div>

            <!-- Verifizierung -->
            <div class="section-title">3. Verifizierung</div>
            <div class="form-group">
                <label>Gewerbeschein-Nachweis</label>
                <input type="file" id="salon-license" class="form-input" style="padding: 10px; background: #242b38;" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" required style="width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0;">
                <span>Ich akzeptiere die Partner-AGB und die GoBD-konforme Abwicklung.</span>
            </div>

            <button type="submit" id="submit-btn" class="fr-btn" style="background: #3182ce; margin-top: 25px; padding: 14px; font-size: 15px;">Partner-Antrag absenden</button>
        </form>
    </div>

    <!-- Firebase Anbindung -->
    <script type="module">
        import { db } from "../assets/js/firebase.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const form = document.getElementById('reg-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Wird übermittelt...";
            btn.disabled = true;

            try {
                const newPartner = {
                    ownerFirstname: document.getElementById('owner-firstname').value,
                    ownerLastname: document.getElementById('owner-lastname').value,
                    email: document.getElementById('salon-email').value,
                    phone: document.getElementById('salon-phone').value,
                    name: document.getElementById('salon-name').value,
                    type: document.getElementById('salon-type').value,
                    location: document.getElementById('salon-location').value,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };

                await addDoc(collection(db, "partners"), newPartner);
                alert('Antrag erfolgreich eingereicht!');
                form.reset();
                btn.innerText = "Partner-Antrag absenden";
                btn.disabled = false;
            } catch (error) {
                console.error("Fehler:", error);
                alert('Fehler beim Speichern.');
                btn.innerText = "Partner-Antrag absenden";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
