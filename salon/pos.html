<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Kasse (Studiolution Stil)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .pos-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; color: #2d3748; }
        .tse-badge { background: #e6f4ea; color: #137333; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="pos-grid">
        <div class="panel">
            <h3>Katalog / Leistungen</h3>
            <p>Hier klickt der Friseur die Belege zusammen (Damen, Herren, Bart, Produkte, Gutscheine)...</p>
        </div>
        <div class="panel">
            <h3>Kasse & Checkout</h3>
            <div class="tse-badge">🔒 Cloud-TSE & GoBD aktiv</div>
            <p><strong>Summe:</strong> 0,00 €</p>
            <button style="width:100%; padding:10px; background:#3182ce; color:white; border:none; border-radius:6px; font-weight:bold;">Beleg drucken / E-Mail</button>
        </div>
    </div>
</body>
</html>
