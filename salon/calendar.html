<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Salon Kalender</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2d3748; margin-top: 0; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .time-slot { display: flex; padding: 12px; border-bottom: 1px solid #edf2f7; align-items: center; justify-content: space-between; }
        .time-slot:hover { background: #f7fafc; }
        .time { font-weight: bold; color: #4a5568; width: 80px; }
        .appointment { background: #ebf8ff; color: #3182ce; padding: 8px 12px; border-radius: 8px; flex: 1; margin-left: 15px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .empty { color: #a0aec0; font-size: 14px; font-style: italic; margin-left: 15px; flex: 1; }
        .btn-add { background: #3182ce; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="calendar-header">
            <h2>📅 Terminkalender (Heute)</h2>
            <button class="btn-add">+ Termin eintragen</button>
        </div>

        <!-- Zeitstrahl / Slots -->
        <div class="time-slot">
            <span class="time">09:00</span>
            <div class="appointment">
                <span>Haarschnitt & Bart (Kunde: Michael B.)</span>
                <span style="font-size: 12px; opacity: 0.8;">Bestätigt</span>
            </div>
        </div>

        <div class="time-slot">
            <span class="time">10:00</span>
            <div class="empty">Freier Termin-Slot</div>
        </div>

        <div class="time-slot">
            <span class="time">11:00</span>
            <div class="appointment" style="background: #fef3c7; color: #d97706;">
                <span>Damen Waschen & Schneiden (Kunde: Anna S.)</span>
                <span style="font-size: 12px; opacity: 0.8;">Hausbesuch (Mobil)</span>
            </div>
        </div>

        <div class="time-slot">
            <span class="time">12:00</span>
            <div class="empty">Mittagspause / Frei</div>
        </div>

        <div class="time-slot">
            <span class="time">14:00</span>
            <div class="appointment">
                <span>Herren-Haarschnitt (Kunde: Kevin R.)</span>
                <span style="font-size: 12px; opacity: 0.8;">Bestätigt</span>
            </div>
        </div>
    </div>
</body>
</html>
