<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Salon Kalender</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background: #1a202c; color: #f7fafc; padding: 20px; }
        .calendar-container { max-width: 800px; margin: 0 auto; background: #2d3748; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .time-slot { display: flex; padding: 14px; border-bottom: 1px solid #4a5568; align-items: center; justify-content: space-between; }
        .time-slot:hover { background: #323d52; }
        .time { font-weight: bold; color: #63b3ed; width: 80px; }
        .appointment { background: #2b6cb0; color: white; padding: 10px 14px; border-radius: 8px; flex: 1; margin-left: 15px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .appointment.mobile { background: #d69e2e; color: #1a202c; }
        .empty { color: #a0aec0; font-size: 14px; font-style: italic; margin-left: 15px; flex: 1; }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #63b3ed;">📅 Tageskalender & Termine</h2>
            <button class="fr-btn" style="width: auto; padding: 8px 14px; font-size: 13px;" onclick="alert('Neuen Termin manuell anlegen')">+ Termin eintragen</button>
        </div>

        <!-- Zeitstrahl / Slots -->
        <div class="time-slot">
            <span class="time">09:00</span>
            <div class="appointment">
                <span>Haarschnitt & Bart (Kunde: Michael B.)</span>
                <span style="font-size: 11px; opacity: 0.9; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px;">Salon</span>
            </div>
        </div>

        <div class="time-slot">
            <span class="time">10:00</span>
            <div class="empty">Freier Termin-Slot</div>
        </div>

        <div class="time-slot">
            <span class="time">11:00</span>
            <div class="appointment mobile">
                <span>Damen Waschen & Schneiden (Kunde: Anna S.)</span>
                <span style="font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.15); padding: 2px 6px; border-radius: 4px;">Hausbesuch (Mobil)</span>
            </div>
        </div>

        <div class="time-slot">
            <span class="time">12:00</span>
            <div class="empty">Mittagspause / Frei</div>
        </div>

        <div class="time-slot">
            <span class="time">14:00</span>
            <div class="appointment">
                <span>Herren-Haarschnitt (Kunde: Kevin R.)</span>
                <span style="font-size: 11px; opacity: 0.9; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px;">Salon</span>
            </div>
        </div>
    </div>
</body>
</html>
