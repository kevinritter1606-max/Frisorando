<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Dein Friseur & Mobiles Styling</title>
    <style>
        :root {
            --primary: #3182ce;
            --primary-dark: #2b6cb0;
            --success: #137333;
            --success-bg: #e6f4ea;
            --bg-main: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 15px 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        /* Hero Suchbereich */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #4299e1 100%);
            color: white;
            padding: 25px 15px 30px 15px;
            text-align: center;
        }

        .search-box-wrapper {
            background: white;
            padding: 6px;
            border-radius: 10px;
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            outline: none;
            color: var(--text-main);
            background: transparent;
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Filter-Leiste */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: white;
            color: var(--primary);
            border-color: white;
        }

        /* Hauptinhalt & Karten */
        .fr-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .fr-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .badge {
            background: #e2e8f0;
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-link {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" style="font-size: 18px; font-weight: 800; color: var(--primary); text-decoration: none;">Frisorando</a>
        <a href="profile.html" style="background: #e2e8f0; color: var(--text-main); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;">👤 Profil</a>
    </header>

    <!-- Such- und Filter Hero -->
    <div class="hero">
        <h1 style="margin: 0 0 6px 0; font-size: 20px;">Dein Friseur. Wann & wo du willst.</h1>
        <p style="margin: 0 0 15px 0; font-size: 12px; opacity: 0.9;">Im Salon vor Ort oder als mobiler Hausbesuch.</p>

        <!-- Suchleiste -->
        <div class="search-box-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="PLZ oder Ort eingeben..." oninput="filterPartners()">
            <button class="search-btn">Suchen</button>
        </div>

        <!-- Filter-Buttons -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
            <button class="filter-btn" onclick="setFilter('salon', this)">✂️ Salon</button>
            <button class="filter-btn" onclick="setFilter('mobile', this)">🚗 Mobil</button>
            <button class="filter-btn" onclick="setFilter('both', this)">⚡ Hybrid</button>
        </div>
    </div>

    <!-- Partner-Liste -->
    <div class="fr-container">
        <h3 style="font-size: 15px; margin-bottom: 12px; color: var(--text-main);">Verfügbare Partner</h3>
        <div id="partners-list">
            <div class="fr-card" style="text-align: center; color: var(--text-muted);">Verbindung zur Datenbank wird aufgebaut...</div>
        </div>
    </div>

    <!-- Firebase & Such-Logik -->
    <script type="module">
        import { db } from "../assets/js/firebase.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allPartners = [];
        let currentFilter = 'all';

        async function fetchPartners() {
            const container = document.getElementById('partners-list');
            try {
                const querySnapshot = await getDocs(collection(db, "partners"));
                allPartners = [];

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    // Wir nehmen alle Partner auf (oder prüfen auf 'active', falls gewünscht)
                    allPartners.push(data);
                });

                if (allPartners.length === 0) {
                    container.innerHTML = `<div class="fr-card" style="text-align: center; color: var(--text-muted);">Es sind noch keine Partner in der Datenbank eingetragen. Registriere zuerst einen Partner über das Partner-Portal!</div>`;
                    return;
                }

                renderPartners(allPartners);
            } catch (error) {
                console.error("Fehler beim Laden:", error);
                container.innerHTML = `<div class="fr-card" style="text-align: center; color: red;">Fehler beim Laden: ${error.message}</div>`;
            }
        }

        window.renderPartners = function(partners) {
            const container = document.getElementById('partners-list');
            container.innerHTML = "";

            if (partners.length === 0) {
                container.innerHTML = `<div class="fr-card" style="text-align: center; color: var(--text-muted);">Keine passenden Partner für diesen Filter gefunden.</div>`;
                return;
            }

            partners.forEach(p => {
                let typeText = "Salon vor Ort";
                if(p.type === 'mobile') typeText = "Mobiler Service";
                if(p.type === 'both') typeText = "Salon & Mobil (Hybrid)";

                const card = document.createElement('div');
                card.className = 'fr-card';
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
                        <h4 style="margin: 0; font-size: 15px; color: var(--text-main);">${p.name || 'Unbenannter Salon'}</h4>
                        <span class="badge">${typeText}</span>
                    </div>
                    <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 12px 0;">📍 ${p.location || 'Kein Standort'} | Inhaber: ${p.ownerFirstname || ''} ${p.ownerLastname || ''}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 10px;">
                        <span style="font-size: 12px; color: ${p.status === 'active' ? 'var(--success)' : 'orange'};">● Status: ${p.status === 'active' ? 'Aktiv' : 'Wartet auf Freigabe'}</span>
                        <a href="booking.html" class="btn-link">Termin wählen</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.filterPartners = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = allPartners.filter(p => {
                const loc = (p.location || '').toLowerCase();
                const name = (p.name || '').toLowerCase();
                const matchesSearch = loc.includes(query) || name.includes(query);
                const matchesType = currentFilter === 'all' || p.type === currentFilter;
                return matchesSearch && matchesType;
            });

            renderPartners(filtered);
        }

        window.setFilter = function(filterType, btnElement) {
            currentFilter = filterType;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            filterPartners();
        }

        // Starten
        fetchPartners();
    </script>
</body>
</html>
