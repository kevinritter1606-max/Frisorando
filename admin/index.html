<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Dein Friseur & Mobiles Styling</title>
    <style>
        :root {
            --primary: #3182ce;
            --primary-dark: #2b6cb0;
            --success: #137333;
            --success-bg: #e6f4ea;
            --bg-main: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 15px 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        /* Hero Suchbereich */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #4299e1 100%);
            color: white;
            padding: 30px 20px 35px 20px;
            text-align: center;
        }

        .search-box-wrapper {
            background: white;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-input {
            flex: 1;
            border: none;
            padding: 12px;
            font-size: 15px;
            outline: none;
            color: var(--text-main);
            background: transparent;
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Filter-Leiste */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: white;
            color: var(--primary);
            border-color: white;
        }

        /* Hauptinhalt & Karten */
        .fr-container {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .fr-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .fr-card:hover {
            transform: translateY(-2px);
        }

        .badge {
            background: #e2e8f0;
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-link {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }
    </style>
</head>

    </header>
