<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Entwicklungsumgebung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 50px 20px;

        .card {
            background: white;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #ff385c; }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #e6f4ea;
            color: #137333;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Frisorando</h1>
        <p>Willkommen in der Testumgebung! Das Fundament steht.</p>

    </div>

    <!-- Firebase SDKs einbinden -->
    <script type="module">

        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

          projectId: "frisorando-dev",
          storageBucket: "frisorando-dev.firebasestorage.app",
          messagingSenderId: "947221498541",

</body>
</html>
