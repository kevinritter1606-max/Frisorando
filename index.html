<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Dein Friseur & Mobiles Styling</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #ff5a79 100%);
            color: white;
            padding: 30px 20px 40px 20px;
            text-align: center;
        }
        .mode-switch {
            display: flex;
            background: rgba(255,255,255,0.2);
            padding: 4px;
            border-radius: 12px;
            max-width: 350px;
            margin: 0 auto 20px auto;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-box-wrapper {
            background: white;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .search-input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header style="background: white; padding: 15px 20px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" style="font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none;">Frisorando</a>
        <a href="profile.html" class="fr-btn fr-btn-secondary" style="width: auto; padding: 8px 14px; font-size: 14px;">👤 Mein Profil</a>
    </header>

    <!-- Hero / Suchbereich -->
    <div class="hero">
        <h1 style="margin: 0 0 10px 0; font-size: 24px;">Dein Friseur. Wann & wo du willst.</h1>
        <p style="margin: 0 0 20px 0; font-size: 14px; opacity: 0.9;">Im Salon oder direkt nach Hause mit mobiler Pauschale.</p>

        <!-- Lieferando-Modus-Umschaltung -->
        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('salon')">✂️ Im Salon</button>
            <button class="mode-btn" onclick="switchMode('mobile')">🚗 Hausbesuch</button>
        </div>

        <!-- Suchleiste -->
        <div class="search-box-wrapper">
            <input type="text" class="search-input" value="Rheinfelden (Baden)" placeholder="PLZ oder Ort...">
            <button class="fr-btn" style="width: auto; padding: 10px 20px;">Suchen</button>
        </div>
    </div>

    <!-- Hauptinhalt: Dynamische Partner-Liste aus Firebase -->
    <div class="fr-container" style="margin-top: -20px;">
        <h3 style="font-size: 18px; margin-bottom: 15px;">Verfügbare Partner in der Nähe</h3>
        
        <div id="partners-list">
            <p style="text-align: center; color: var(--text-muted); font-size: 14px;">Lade verfügbare Partner aus der Datenbank...</p>
        </div>
    </div>

    <!-- Firebase Live-Anbindung -->
    <script type="module">
        import { db } from "../assets/js/firebase.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function loadPartners() {
            const container = document.getElementById('partners-list');
            try {
                const querySnapshot = await getDocs(collection(db, "partners"));
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="fr-card" style="text-align: center; color: var(--text-muted);">Momentan sind keine aktiven Partner online.</div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    
                    // Nur freigegebene oder alle anzeigen (hier zur Ansicht)
                    const card = document.createElement('div');
                    card.className = 'fr-card';
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                            <h4 style="margin: 0; font-size: 17px;">${p.name}</h4>
                            <span class="fr-badge">${p.type === 'mobile' ? '🚗 Mobiler Service' : '⚡ Salon vor Ort'}</span>
                        </div>
                        <p style="font-size: 13px; color: var(--text-muted); margin: 0 0 15px 0;">📍 ${p.location}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px;">
                            <span style="font-size: 13px;">Status: <strong>${p.status === 'pending' ? 'Wartet auf Freigabe' : 'Aktiv'}</strong></span>
                            <a href="booking.html" class="fr-btn" style="width: auto; padding: 8px 16px; font-size: 13px;">Termin wählen</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Fehler beim Laden der Partner:", error);
                container.innerHTML = `<div class="fr-card" style="text-align: center; color: var(--primary);">Fehler beim Laden der Datenbank.</div>`;
            }
        }

        loadPartners();
    </script>

    <script>
        function switchMode(mode) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if(mode === 'salon') {
                buttons[0].classList.add('active');
            } else {
                buttons[1].classList.add('active');
            }
        }
    </script>

</body>
</html>
