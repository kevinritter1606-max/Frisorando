<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisorando - Premium Friseur- & Haardienstleistungen</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .mode-switch {
            display: flex;
            background: rgba(255,255,255,0.15);
            padding: 4px;
            border-radius: 12px;
            max-width: 340px;
            margin: 0 auto 20px auto;
        }
        .mode-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .mode-btn.active {
            background: white;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-box-wrapper {
            background: white;
            padding: 6px;
            border-radius: 12px;
            display: flex;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .search-input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            outline: none;
            background: transparent;
        }
        .search-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover {
            background: #334155;
        }
        .auth-header-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .auth-header-btn:hover {
            background: #f1f5f9;
            border-color: var(--text-muted);
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 15px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .filter-chip {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.15s;
        }
        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .partner-card {
            background: white;
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #auth-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .auth-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 8px;
            background: none;
            border: none;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header style="background: white; padding: 12px 20px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" style="font-size: 20px; font-weight: 800; color: var(--primary); text-decoration: none;">Frisorando</a>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button onclick="openAuthModal()" class="auth-header-btn">👤 Anmelden</button>
            <a href="admin/index.html" style="font-size: 11px; background: #1e293b; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: 600;">Admin</a>
        </div>
    </header>

    <!-- AUTH MODAL -->
    <div id="auth-modal">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login-btn" onclick="switchAuthTab('login')">Anmelden</button>
                <button class="auth-tab" id="tab-reg-btn" onclick="switchAuthTab('register')">Registrieren</button>
            </div>

            <form id="form-login" onsubmit="handleUserLogin(event)">
                <div class="form-group">
                    <label>E-Mail-Adresse</label>
                    <input type="email" id="login-email" class="form-input" required placeholder="deine@email.de">
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" class="form-input" required>
                        <button type="button" class="toggle-password" onclick="togglePass('login-password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-action" style="width: 100%; padding: 8px; font-size: 12px; margin-top: 5px;">Einloggen</button>
            </form>

            <form id="form-register" style="display: none;" onsubmit="handleUserRegister(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                    <div class="form-group">
                        <label>Vorname</label>
                        <input type="text" id="reg-firstname" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Nachname</label>
                        <input type="text" id="reg-lastname" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>E-Mail-Adresse</label>
                    <input type="email" id="reg-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" class="form-input" required>
                        <button type="button" class="toggle-password" onclick="togglePass('reg-password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-action" style="width: 100%; padding: 8px; font-size: 12px; margin-top: 5px;">Konto erstellen</button>
            </form>

            <button onclick="closeAuthModal()" style="background: none; border: none; width: 100%; text-align: center; margin-top: 10px; font-size: 11px; color: var(--text-muted); cursor: pointer;">Schließen</button>
        </div>
    </div>

    <!-- Hero / Professioneller Suchbereich mit fixem Dunkel-Hintergrund -->
    <div style="background: #1e293b; color: white; padding: 40px 20px 50px 20px; text-align: center;">
        <h1 style="margin: 0 0 8px 0; font-size: 22px; color: white;">Professionelle Haardienstleistungen & Mobile Salons</h1>
        <p style="margin: 0 0 20px 0; font-size: 13px; opacity: 0.85; color: #94a3b8;">Wählen Sie zwischen Salon-Terminen vor Ort oder einem flexiblen Hausbesuch.</p>

        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('salon')">✂️ Im Salon</button>
            <button class="mode-btn" onclick="switchMode('mobile')">🚗 Hausbesuch</button>
        </div>

        <div class="search-box-wrapper">
            <input type="text" class="search-input" id="search-location" value="Rheinfelden (Baden)" placeholder="PLZ oder Ort eingeben...">
            <button class="search-btn">Suchen</button>
        </div>
    </div>

    <!-- Filterleiste -->
    <div class="filter-bar">
        <button class="filter-chip active" onclick="filterPartners('all', this)">Alle anzeigen</button>
        <button class="filter-chip" onclick="filterPartners('top', this)">Top bewertet</button>
        <button class="filter-chip" onclick="filterPartners('mobile', this)">Nur Mobiler Service</button>
    </div>

    <!-- Partner-Liste -->
    <div style="max-width: 650px; margin: 0 auto 30px auto; padding: 0 15px;">
        <h3 style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;" id="result-heading">Verfügbare Partner in Ihrer Nähe</h3>
        
        <div id="partners-list">
            <p style="text-align: center; color: var(--text-muted); font-size: 13px;">Lade Partner aus der Datenbank...</p>
        </div>
    </div>

    <!-- Firebase Live-Anbindung & Logik -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCbfAJFizefkyNlFtdEr3Law2hGrN3GNlg",
          authDomain: "frisorando-dev-f40fd.firebaseapp.com",
          projectId: "frisorando-dev-f40fd",
          storageBucket: "frisorando-dev-f40fd.firebasestorage.app",
          messagingSenderId: "398947266719",
          appId: "1:398947266719:web:99108e06dc7669e97832aa",
          measurementId: "G-V0E0GSK7P4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPartnersCache = [];

        async function loadHomePartners() {
            const container = document.getElementById('partners-list');
            try {
                const querySnapshot = await getDocs(collection(db, "partners"));
                allPartnersCache = [];
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="partner-card" style="justify-content: center; color: var(--text-muted);">Momentan sind keine aktiven Partner verfügbar.</div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    if (p.status !== 'active') return; 
                    allPartnersCache.push(p);
                });

                renderPartnerCards(allPartnersCache);
            } catch (error) {
                console.error("Fehler beim Laden:", error);
                container.innerHTML = `<div class="partner-card" style="justify-content: center; color: var(--danger);">Fehler beim Laden der Daten.</div>`;
            }
        }

        window.renderPartnerCards = function(partners) {
            const container = document.getElementById('partners-list');
            container.innerHTML = "";

            if (partners.length === 0) {
                container.innerHTML = `<div class="partner-card" style="justify-content: center; color: var(--text-muted);">Keine Partner gefunden.</div>`;
                return;
            }

            partners.forEach(p => {
                const card = document.createElement('div');
                card.className = 'partner-card';
                card.innerHTML = `
                    <div>
                        <h4 style="margin: 0 0 3px 0; font-size: 15px; color: var(--text-main);">${p.name || p.salonName || 'Salon'}</h4>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 6px 0;">📍 ${p.location || 'Rheinfelden'} • ⭐ 4,9 (18)</p>
                        <div style="display: flex; gap: 5px;">
                            <span class="badge ${p.type === 'mobile' ? 'badge-pending' : 'badge-active'}">${p.type === 'mobile' ? '🚗 Mobiler Service' : '⚡ Salon vor Ort'}</span>
                        </div>
                    </div>
                    <div>
                        <a href="salon/index.html" class="btn-action" style="padding: 7px 14px; font-size: 12px; text-decoration: none; display: inline-block;">Auswählen ➔</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.filterPartners = function(type, btn) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'all') {
                renderPartnerCards(allPartnersCache);
            } else if (type === 'mobile') {
                const filtered = allPartnersCache.filter(p => p.type === 'mobile' || p.type === 'both');
                renderPartnerCards(filtered);
            } else {
                renderPartnerCards(allPartnersCache);
            }
        }

        window.openAuthModal = function() { document.getElementById('auth-modal').style.display = 'flex'; }
        window.closeAuthModal = function() { document.getElementById('auth-modal').style.display = 'none'; }

        window.switchAuthTab = function(tab) {
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-reg-btn');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');

            if (tab === 'login') {
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
            } else {
                regBtn.classList.add('active');
                loginBtn.classList.remove('active');
                regForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        window.togglePass = function(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        window.handleUserLogin = function(e) {
            e.preventDefault();
            alert('Erfolgreich angemeldet!');
            closeAuthModal();
        }

        window.handleUserRegister = async function(e) {
            e.preventDefault();
            const firstname = document.getElementById('reg-firstname').value.trim();
            const lastname = document.getElementById('reg-lastname').value.trim();
            const email = document.getElementById('reg-email').value.trim();

            try {
                await addDoc(collection(db, "customers"), { firstname, lastname, email, createdAt: new Date().toISOString() });
                alert('Konto erfolgreich erstellt!');
                closeAuthModal();
            } catch (err) {
                alert('Fehler bei der Registrierung: ' + err.message);
            }
        }

        loadHomePartners();
    </script>

    <script>
        function switchMode(mode) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if(mode === 'salon') {
                buttons[0].classList.add('active');
            } else {
                buttons[1].classList.add('active');
            }
        }
    </script>

</body>
</html>
